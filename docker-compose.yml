services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: numflex
      POSTGRES_PASSWORD: numflex
      POSTGRES_DB: numflex
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numflex"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: numflex
      POSTGRES_PASSWORD: numflex
      POSTGRES_DB: numflex_test
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numflex -d numflex_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    image: numflex-sandbox:latest
    depends_on:
      postgres:
        condition: service_healthy
    # The repository's .env, if it exists, feeds the container; it is not required.
    env_file:
      - path: .env
        required: false
    # This block wins over the file — deliberately: this value must be true
    # *inside the compose network*, where the database is not called localhost.
    # All the rest of the configuration is set through the .env.
    environment:
      DATABASE_URL: postgres://numflex:numflex@postgres:5432/numflex?sslmode=disable
    # PORT is read from the same .env, host side as container side: both ends
    # of the publication stay aligned if it is changed.
    ports: ["${PORT:-8080}:${PORT:-8080}"]
