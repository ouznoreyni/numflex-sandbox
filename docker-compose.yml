services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: numflex
      POSTGRES_PASSWORD: numflex
      POSTGRES_DB: numflex
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numflex"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: numflex
      POSTGRES_PASSWORD: numflex
      POSTGRES_DB: numflex_test
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numflex"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://numflex:numflex@postgres:5432/numflex?sslmode=disable
      FIDELITY: real
      # Permet à la page Swagger (make swagger, port 8081) d'appeler l'API
      # depuis un navigateur. La plateforme réelle n'envoie pas de CORS.
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    ports: ["8080:8080"]
